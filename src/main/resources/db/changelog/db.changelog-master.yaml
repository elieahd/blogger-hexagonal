databaseChangeLog:
  - changeSet:
      id: 001
      author: elieahd
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
  - changeSet:
      id: 002
      author: elieahd
      changes:
        - createTable:
            tableName: post
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: post
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_post_category
  - changeSet:
      id: 003
      author: elieahd
      changes:
        - sqlFile:
            path: sql/categories.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 004
      author: elieahd
      changes:
        - sqlFile:
            path: sql/posts.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true